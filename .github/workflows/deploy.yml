name: Multi-Branch Deployment

on:
  push:
    branches:
      - staging
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17 (LTS)
        # Changed to Java 17 for Long-Term Support (LTS) and stability.
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # Latest from Eclipse Temurin

      - name: Build WAR file
        run: |
          chmod +x mvnw
          ./mvnw clean package

      - name: Deploy to Remote Server
        env:
          # Define environment variables for clarity and reusability
          WAR_SOURCE_PATH: target/tomcat-sample.war # The WAR file generated by your build
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
          TOMCAT_WEBAPPS_DIR: "/var/lib/tomcat9/webapps" # Standard Tomcat webapps directory

        run: |
          # --- SSH Key Setup ---
          # Create and secure the SSH key file for authentication
          echo "$SERVER_KEY" > key.pem
          chmod 600 key.pem

          # --- Determine Deployment Context ---
          # Get the branch name to decide where to deploy
          BRANCH_NAME="${GITHUB_REF##*/}"
          DEPLOY_CONTEXT=""

          if [[ "$BRANCH_NAME" == "staging" ]]; then
            DEPLOY_CONTEXT="staging"
          elif [[ "$BRANCH_NAME" == "production" ]]; then
            DEPLOY_CONTEXT="production"
          else
            echo "Unknown branch ($BRANCH_NAME). Skipping deployment."
            exit 1 # Exit the step if the branch is not 'staging' or 'production'
          fi

          # The WAR file will be renamed to match the context path (e.g., staging.war)
          DEPLOY_WAR_NAME="$DEPLOY_CONTEXT.war"
          echo "Preparing to deploy branch '$BRANCH_NAME' as '$DEPLOY_WAR_NAME' to $TOMCAT_WEBAPPS_DIR"

          # --- Deployment Steps via SSH ---
          # Use -o StrictHostKeyChecking=no for non-interactive SSH in CI/CD.
          # The '|| true' or '|| { echo "message"; }' makes the command not fail the step
          # if, for example, Tomcat is already stopped or cleanup fails (which can happen).

          # 1. Stop Tomcat Service for a clean deployment
          echo "Stopping Tomcat service..."
          ssh -i key.pem -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "sudo systemctl stop tomcat9" || { echo "Tomcat stop command failed or Tomcat was already stopped."; }

          # 2. Clean up previous deployed application to ensure a fresh install
          echo "Cleaning up previous deployment at $TOMCAT_WEBAPPS_DIR/$DEPLOY_CONTEXT*..."
          # This command removes the old .war file and the exploded directory if they exist.
          # It also removes the original 'tomcat-sample.war' in case it was deployed under that name previously.
          ssh -i key.pem -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "sudo rm -rf $TOMCAT_WEBAPPS_DIR/$DEPLOY_CONTEXT* $TOMCAT_WEBAPPS_DIR/$(basename $WAR_SOURCE_PATH)" || { echo "Cleanup command failed or no old deployment found."; }


          # 3. Copy the new WAR file to the Tomcat webapps directory
          # The WAR file is renamed to match the desired context path (e.g., 'staging.war')
          echo "Copying '$WAR_SOURCE_PATH' to '$SERVER_USER@$SERVER_IP:$TOMCAT_WEBAPPS_DIR/$DEPLOY_WAR_NAME'"
          scp -i key.pem -o StrictHostKeyChecking=no "$WAR_SOURCE_PATH" "$SERVER_USER@$SERVER_IP:$TOMCAT_WEBAPPS_DIR/$DEPLOY_WAR_NAME"

          # 4. Start Tomcat Service
          echo "Starting Tomcat service..."
          ssh -i key.pem -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "sudo systemctl start tomcat9"

          echo "Deployment process finished for $DEPLOY_CONTEXT!"