name: Multi-Branch Deployment

on:
  push:
    branches:
      - staging
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print current directory
        run: pwd

      - name: List all files and folders
        run: ls -R

      - name: Set up Java 17 (LTS)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Manually build WAR file
        run: |
          mkdir -p target
          jar -cvf sample.war *
          mkdir -p /tmp/tomcat/webapps
          cp sample.war /tmp/tomcat/webapps
          
      - name: Deploy to Remote Server
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: /tmp/tomcat/webapps/sample.war
          target: /usr/local/apache-tomcat-11.0.7/webapps
        run: |
          echo "$SERVER_KEY" > key.pem
          chmod 600 key.pem

          BRANCH_NAME="${GITHUB_REF##*/}"
          DEPLOY_CONTEXT=""

          if [[ "$BRANCH_NAME" == "staging" ]]; then
            DEPLOY_CONTEXT="staging"
          elif [[ "$BRANCH_NAME" == "production" ]]; then
            DEPLOY_CONTEXT="production"     
          else
            echo "Unknown branch ($BRANCH_NAME). Skipping deployment."
            exit 1
          fi

          DEPLOY_WAR_NAME="$DEPLOY_CONTEXT.war"
          echo "Preparing to deploy branch '$BRANCH_NAME' as '$DEPLOY_WAR_NAME' to $TOMCAT_WEBAPPS_DIR"

          echo "Stopping Tomcat service..."
          ssh -i key.pem -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "sudo systemctl stop tomcat9" || { echo "Tomcat stop command failed or Tomcat was already stopped."; }

          echo "Cleaning up previous deployment at $TOMCAT_WEBAPPS_DIR/$DEPLOY_CONTEXT*..."
          ssh -i key.pem -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "sudo rm -rf $TOMCAT_WEBAPPS_DIR/$DEPLOY_CONTEXT* $TOMCAT_WEBAPPS_DIR/$(basename $WAR_SOURCE_PATH)" || { echo "Cleanup command failed or no old deployment found."; }

          echo "Copying '$WAR_SOURCE_PATH' to '$SERVER_USER@$SERVER_IP:$TOMCAT_WEBAPPS_DIR/$DEPLOY_WAR_NAME'"
          scp -i key.pem -o StrictHostKeyChecking=no "$WAR_SOURCE_PATH" "$SERVER_USER@$SERVER_IP:$TOMCAT_WEBAPPS_DIR/$DEPLOY_WAR_NAME"

          echo "Starting Tomcat service..."
          ssh -i key.pem -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "sudo systemctl start tomcat9"

          echo "Deployment process finished for $DEPLOY_CONTEXT!"