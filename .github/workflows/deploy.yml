name: Deploy Java Web App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'openjdk'

      - name: Package WAR (Optional)
        run: |
          # If your app is not already a WAR, package it
          # Adjust paths as needed for your project structure
          if [ -d "myapp" ]; then
            jar -cvf myapp.war -C myapp .
          fi
        working-directory: ./

      - name: Set up SSH key
        env:
          DEPLOY_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$DEPLOY_KEY" > key.pem
          chmod 400 key.pem

      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "myapp.war"  # Or "myapp/" if deploying directory
          target: "/opt/tomcat/webapps/"

      - name: Restart Tomcat
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            sudo systemctl restart tomcat || sudo /opt/tomcat/bin/shutdown.sh && sudo /opt/tomcat/bin/startup.sh
          '